syntax = "proto3";

package genius.credentials.v1;

import "genius/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

enum CredentialType {
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  CREDENTIAL_TYPE_HTTP_HEADER = 1;
  CREDENTIAL_TYPE_BEARER = 2;
  CREDENTIAL_TYPE_BASIC = 3;
  // OAuth2 access token (and optional refresh metadata). Injected as Bearer.
  // secret: { "access_token": "...", "refresh_token": "...", "token_type": "Bearer" }
  CREDENTIAL_TYPE_OAUTH2 = 4;
}

// Credential is a redacted view — secret material is never returned.
message Credential {
  string id = 1;
  string name = 2;
  CredentialType type = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateCredentialRequest {
  string name = 1;
  CredentialType type = 2;
  // type-specific secret payload (never echoed back):
  // bearer: { "token": "..." }
  // basic: { "username": "...", "password": "..." }
  // http_header: { "header": "Authorization", "value": "..." }
  // oauth2: { "access_token": "...", "refresh_token": "...", "token_type": "Bearer" }
  map<string, string> secret = 3;
}

message CreateCredentialResponse {
  Credential credential = 1;
}

message ListCredentialsRequest {
  genius.common.v1.PageRequest page = 1;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
  genius.common.v1.PageResponse page = 2;
}

message GetCredentialRequest {
  string id = 1;
}

message DeleteCredentialRequest {
  string id = 1;
}

message DeleteCredentialResponse {}

service Credentials {
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc GetCredential(GetCredentialRequest) returns (Credential);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}
